<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff1b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="não mente pra mim">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>não mente pra mim</title>
<style>
:root{--red:#ff1b2d;--red-dark:#d90d20;--yellow:#fff0a8;--white:#fff;--soft:#ffd9dc;--shadow:#8b061866}
*{box-sizing:border-box}body{margin:0;background:var(--red);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100svh}
button{font:inherit;cursor:pointer}.app{max-width:540px;margin:auto;min-height:100svh;padding:env(safe-area-inset-top) 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0 16px;border-bottom:1px solid #ffffff55}.brand{font-weight:900;font-size:19px;letter-spacing:-.7px}.sub{font-size:10px;color:var(--yellow);letter-spacing:.19em;margin-top:5px;text-transform:uppercase}
.iconbtn{background:transparent;color:var(--white);border:1px solid #ffffff88;border-radius:50%;width:42px;height:42px;font-size:12px;font-weight:bold}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px 0}.welcome{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}.welcome h1{font-size:clamp(38px,10vw,56px);line-height:.98;letter-spacing:-2px;margin:0;font-weight:900;max-width:390px}.welcome p{color:var(--yellow);font-size:14px;line-height:1.5;max-width:300px;margin:0 0 8px}.langchoices{display:grid;gap:12px;width:100%;max-width:330px}.langbtn{background:var(--white);color:var(--red-dark);border:0;border-radius:12px;padding:17px;font-size:15px;font-weight:800;box-shadow:0 7px 0 var(--shadow)}.langbtn:active{transform:translateY(3px);box-shadow:0 4px 0 var(--shadow)}
#game{display:none}.eyebrow{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--yellow);text-transform:uppercase;font-weight:700}.card{background:var(--white);color:var(--red-dark);border-radius:18px;min-height:365px;padding:24px 22px 20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 16px 35px var(--shadow);touch-action:pan-y;user-select:none;transition:transform .18s ease}.cardtop,.cardbottom{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.1em;color:#d14a53;font-weight:700;text-transform:uppercase}.question{font-size:clamp(25px,7vw,35px);line-height:1.2;text-align:center;overflow-wrap:anywhere;font-weight:800}.wild{color:#b48b00}.progress{text-align:center;color:var(--yellow);font-size:11px;letter-spacing:.12em}
.controls{display:flex;gap:10px;justify-content:center}.action{border:1px solid #ffffffaa;background:transparent;color:var(--white);padding:14px 13px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;flex:1}.action.primary{background:var(--yellow);color:var(--red-dark);border-color:var(--yellow)}.toolbar{display:flex;justify-content:space-between;gap:8px}.small{background:none;border:0;color:var(--yellow);font-size:10px;font-weight:700;letter-spacing:.06em;padding:9px 0}
nav{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{background:transparent;border:1px solid #ffffff88;color:var(--white);padding:9px 11px;border-radius:30px;font-size:10px;font-weight:700;letter-spacing:.04em}.chip.active{background:var(--yellow);border-color:var(--yellow);color:var(--red-dark)}.panel{background:var(--red-dark);border:1px solid #ffffff55;border-radius:12px;padding:15px;display:none}.panel.show{display:block}.panel h2{font-size:18px;margin:0 0 10px}.list{max-height:40vh;overflow:auto}.entry{padding:11px 0;border-bottom:1px solid #ffffff33;font-size:14px;line-height:1.4}.entry small{display:block;color:var(--yellow);font-size:10px;letter-spacing:.08em;margin-bottom:4px}
footer{text-align:center;color:#ffe4e5;font-size:9px;letter-spacing:.12em;padding:14px 0 4px}#gameHeader{display:none}@media(max-height:720px){.card{min-height:290px}.question{font-size:26px}main{gap:13px;padding:14px 0}}
</style></head><body><div class="app">
<header><div><div class="brand">não mente pra mim</div><div class="sub" id="tagline">um jogo de conexão</div></div><button class="iconbtn" id="langBtn" aria-label="Change language">EN</button></header>
<main>
<section class="welcome" id="welcome"><h1>não mente<br>pra mim.</h1><p id="welcomeText">Até onde você está disposto a ser sincero?</p><div class="langchoices"><button class="langbtn" id="choosePt">🇧🇷 Português (Brasil)</button><button class="langbtn" id="chooseEn">🇬🇧 English</button></div></section>
<section id="game"><nav id="levels"></nav><div class="eyebrow" id="levelLabel">TODAS AS CARTAS</div><div class="card" id="card"><div class="cardtop"><span id="cardLevel"></span><span id="cardNum"></span></div><div class="question" id="question">...</div><div class="cardbottom"><span id="cardType"></span><span id="swipeHint"></span></div></div><div class="progress" id="progress"></div><div class="controls"><button class="action" id="prev"></button><button class="action primary" id="next"></button></div><div class="toolbar"><button class="small" id="shuffle"></button><button class="small" id="favorite"></button><button class="small" id="favoritesBtn"></button><button class="small" id="historyBtn"></button></div><section class="panel" id="panel"><h2 id="panelTitle"></h2><div class="list" id="panelList"></div></section></section>
</main><footer id="footerText">VÁ NO SEU TEMPO · NÃO EXISTEM RESPOSTAS ERRADAS</footer></div>
<script>
let all=[],deck=[],index=0,level='ALL',lang=localStorage.getItem('nm-language')||'',history=JSON.parse(localStorage.getItem('nm-history')||'[]'),favorites=JSON.parse(localStorage.getItem('nm-favorites')||'[]');
const $=id=>document.getElementById(id);
const words={pt:{tag:'um jogo de conexão',welcome:'Até onde você está disposto a ser sincero?',all:'TODAS',levels:['NÍVEL 1','NÍVEL 2','NÍVEL 3'],allLevels:'TODOS OS NÍVEIS',wild:'CORINGA',talk:'CONVERSA',swipe:'DESLIZE PARA AVANÇAR',back:'← VOLTAR',next:'PRÓXIMA CARTA →',shuffle:'⤨ EMBARALHAR',favorite:'♡ FAVORITAS',saved:'♥ SALVA',history:'◷ HISTÓRICO',recent:'Vistas recentemente',empty:'Ainda não há cartas por aqui.',footer:'VÁ NO SEU TEMPO · NÃO EXISTEM RESPOSTAS ERRADAS',change:'EN'},en:{tag:'a game of connection',welcome:'How honest are you willing to be?',all:'ALL',levels:['LEVEL ONE','LEVEL TWO','LEVEL THREE'],allLevels:'ALL LEVELS',wild:'WILDCARD',talk:'CONVERSATION',swipe:'SWIPE TO EXPLORE',back:'← BACK',next:'NEXT CARD →',shuffle:'⤨ SHUFFLE',favorite:'♡ FAVORITES',saved:'♥ SAVED',history:'◷ HISTORY',favoritesBtn:'♡ SAVED',recent:'Recently viewed',empty:'No cards here yet.',footer:'TAKE YOUR TIME · THERE ARE NO WRONG ANSWERS',change:'PT'}};
const t=()=>words[lang==='pt'?'pt':'en'];const textOf=c=>lang==='pt'?c.text_pt:c.text_en;const levelName=v=>v==='LEVEL ONE'?t().levels[0]:v==='LEVEL TWO'?t().levels[1]:t().levels[2];
async function init(){all=await(await fetch('cards.json')).json();$('choosePt').onclick=()=>start('pt');$('chooseEn').onclick=()=>start('en');$('langBtn').onclick=()=>{if(!lang){$('welcome').style.display='flex';return}start(lang==='pt'?'en':'pt')};if(lang)start(lang);}
function start(language){lang=language;localStorage.setItem('nm-language',lang);$('welcome').style.display='none';$('game').style.display='block';document.documentElement.lang=lang==='pt'?'pt-BR':'en';$('tagline').textContent=t().tag;$('welcomeText').textContent=t().welcome;$('langBtn').textContent=t().change;$('footerText').textContent=t().footer;$('prev').textContent=t().back;$('next').textContent=t().next;$('shuffle').textContent=t().shuffle;$('historyBtn').textContent=t().history;$('favoritesBtn').textContent=t().favoritesBtn;buildLevels();setLevel(level);}
function buildLevels(){let nav=$('levels');nav.innerHTML='';[['ALL',t().all],['LEVEL ONE',t().levels[0]],['LEVEL TWO',t().levels[1]],['LEVEL THREE',t().levels[2]]].forEach(([v,label])=>{let b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.level=v;b.onclick=()=>setLevel(v);nav.append(b)})}
function setLevel(v){level=v;deck=all.filter(c=>v==='ALL'||c.level===v);index=0;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.level===v));$('levelLabel').textContent=v==='ALL'?t().allLevels:levelName(v);$('panel').classList.remove('show');render()}
function render(){if(!deck.length)return;let c=deck[index];$('question').textContent=textOf(c);$('question').classList.toggle('wild',c.wildcard);$('cardLevel').textContent=levelName(c.level);$('cardNum').textContent='CARTA '+String(all.findIndex(x=>x.id===c.id)+1).padStart(3,'0');if(lang==='en')$('cardNum').textContent='CARD '+String(all.findIndex(x=>x.id===c.id)+1).padStart(3,'0');$('cardType').textContent=c.wildcard?t().wild:t().talk;$('swipeHint').textContent=t().swipe;$('progress').textContent=(index+1)+' / '+deck.length;$('favorite').textContent=favorites.includes(c.id)?t().saved:t().favorite;$('favorite').style.color=favorites.includes(c.id)?'var(--yellow)':'';history.unshift(c.id);history=[...new Set(history)].slice(0,100);localStorage.setItem('nm-history',JSON.stringify(history))}
function move(n){index=(index+n+deck.length)%deck.length;render()}$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('shuffle').onclick=()=>{deck=[...deck].sort(()=>Math.random()-.5);index=0;render()};
$('favorite').onclick=()=>{let id=deck[index].id;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('nm-favorites',JSON.stringify(favorites));render()};
function showPanel(type){let p=$('panel');p.classList.toggle('show');if(!p.classList.contains('show'))return;let ids=type==='favorites'?[...favorites].reverse():history;$('panelTitle').textContent=type==='favorites'?t().favorite:t().recent;$('panelList').innerHTML='';let items=ids.map(id=>all.find(c=>c.id===id)).filter(Boolean);if(!items.length){$('panelList').textContent=t().empty;return}items.forEach(c=>{let d=document.createElement('div');d.className='entry';let s=document.createElement('small');s.textContent=levelName(c.level)+(c.wildcard?' · '+t().wild:'');d.append(s,document.createTextNode(textOf(c)));d.onclick=()=>{setLevel(c.level);index=deck.findIndex(x=>x.id===c.id);render();p.classList.remove('show')};$('panelList').append(d)})}
$('historyBtn').onclick=()=>showPanel('history');$('favoritesBtn').onclick=()=>showPanel('favorites');
let startX=0;const card=$('card');card.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});card.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>55)move(dx<0?1:-1)},{passive:true});card.addEventListener('mousedown',e=>startX=e.clientX);card.addEventListener('mouseup',e=>{let dx=e.clientX-startX;if(Math.abs(dx)>70)move(dx<0?1:-1)});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script></body></html>
