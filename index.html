<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a0a0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="unmask">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<title>unmask</title>
<style>
:root{--red:#6a0a0f;--red-dark:#5b080d;--yellow:#efe4b0;--cream:#efe4b0;--paper:#fbf6e6;--ink:#2a1214;--gray:#8a7c78;--shadow:#1f0204aa;--poster:'Patrick Hand','Marker Felt','Chalkboard SE','Comic Sans MS',cursive;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--red);overflow:hidden}
body{color:#fff;font-family:var(--sys);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
svg{display:block}.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{position:relative;max-width:540px;height:100svh;height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;overflow:hidden;transition:transform .6s cubic-bezier(.65,0,.25,1);will-change:transform}
.app.notrans{transition:none}.app.home{overflow-y:auto}

/* controles comuns */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;background:#ffffff33;border-radius:10px}
.seg button{border:0;background:transparent;color:#fff;font-size:13px;font-weight:600;padding:8px 4px;border-radius:8px;transition:background .2s,color .2s}
.seg button.active{background:var(--cream);color:var(--red-dark);box-shadow:0 1px 4px #0003}
.cta{border:0;border-radius:14px;background:var(--cream);color:var(--red-dark);font-size:17px;font-weight:700;padding:16px;transition:transform .12s}.cta:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* tela inicial */
.welcome{display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0;padding:10px 0;width:100%;max-width:340px;align-self:center;text-align:center}
.mark{margin:0;width:min(74vw,290px);color:var(--cream)}.mark svg{display:block;width:100%;height:auto;overflow:visible}
.cupidmove{position:relative;width:54%;margin:-2.9% 0 0 24.4%;will-change:transform}.cupidwrap{position:relative}.logoarrow{position:absolute;left:0;top:0;height:100%;will-change:transform}
.menu{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;will-change:transform}
.cupidwrap{animation:bob 3.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.arrow{position:absolute;left:0;z-index:4;pointer-events:none;color:var(--cream);will-change:transform;filter:drop-shadow(0 0 1px #3a0408) drop-shadow(0 0 1.5px #3a0408)}
.row input::placeholder{font-weight:400;color:#bfb2ae}.arrow svg{display:block}
.welcome p{color:var(--yellow);font-size:15px;line-height:1.4;margin:0}
.group{width:100%;background:var(--paper);border-radius:14px;overflow:hidden;text-align:left}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;color:var(--ink)}.row+.row{border-top:1px solid #e5e5ea}
.row span{width:84px;flex:none;font-size:15px;color:var(--gray)}.row input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;font-weight:600;color:var(--ink);padding:14px 0}
.welcome .seg,.welcome .cta{width:100%}
.hint{font-size:12px!important;color:#ffe4e5!important;opacity:.9}

/* jogo */
#game{display:none}.app:not(.home) #welcome{display:none}.app:not(.home) #game{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.navbar{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.navbtn{display:flex;align-items:center;gap:2px;background:none;border:0;color:#fff;font-size:17px;padding:6px 6px 6px 0}.navbtn svg{width:22px;height:22px;stroke-width:2.6}
.pill{background:#ffffff33;border:0;color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}
.turn{text-align:center;display:flex;flex-direction:column;gap:4px}.turn b{font-family:var(--poster);font-weight:400;font-size:42px;line-height:1;overflow-wrap:anywhere}.turn span{font-size:13px;color:var(--yellow)}
.card{flex:1;min-height:0;background:var(--paper);color:var(--red-dark);border-radius:22px;padding:18px 20px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 40px -12px var(--shadow);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cardtop,.cardbottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;color:#9b5a58;font-weight:700;text-transform:uppercase}
.heart{background:none;border:0;color:var(--red-dark);padding:2px;margin:-2px -2px 0 0}.heart svg{width:28px;height:28px}.heart.on svg{fill:currentColor}
.question{font-size:clamp(22px,6.4vw,32px);line-height:1.22;text-align:center;overflow-wrap:anywhere;font-weight:800;padding:8px 0}.wild{color:#b48b00}
.progress{text-align:center;color:var(--yellow);font-size:12px;font-weight:600}

.round{width:54px;flex:none;border:0;border-radius:14px;background:#ffffff33;color:#fff;display:grid;place-items:center;transition:opacity .2s,transform .12s}.round:active{transform:scale(.95)}.round:disabled{opacity:.35}.round svg{width:24px;height:24px;stroke-width:2.6}
.tabbar{display:flex;background:#ffffff29;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:20px;padding:4px 8px}
.tabbar button{flex:1;background:none;border:0;color:#fff;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:600;padding:6px}.tabbar svg{width:24px;height:24px}

/* sheet (favoritas / histórico) */
.scrim{position:absolute;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:74%;display:flex;flex-direction:column;background:#f3ecd6;color:var(--ink);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);z-index:6;visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:8px auto 0}
.sheethead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px}.sheethead h2{margin:0;font-size:20px}.sheethead button{background:none;border:0;color:var(--red-dark);font-size:17px;font-weight:600}
.sheetlist{overflow:auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheetlist .group{border-radius:12px}.entry{display:block;width:100%;text-align:left;background:var(--paper);border:0;color:var(--ink);padding:13px 16px;font-size:16px;line-height:1.35}.entry+.entry{border-top:1px solid #e5e5ea}.entry small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red-dark);margin-bottom:3px}
.empty{color:var(--gray);text-align:center;padding:28px 12px;font-size:15px}

.controls{display:none;gap:10px}.controls .cta{flex:1}.cta.ghost{background:#ffffff33;color:#fff}
.app[data-phase=read] #ctlRead,.app[data-phase=think] #ctlThink,.app[data-phase=answer] #ctlRate{display:flex}
.tools{display:flex;gap:8px}.tools .heart{margin:0}.dots circle{fill:currentColor;stroke:none}.app[data-phase=answer] #more{opacity:.3;pointer-events:none}
.slot{min-height:46px;display:grid;place-items:center}.timer{display:none;width:100%;text-align:center}
.app[data-phase=think] .timer{display:grid;gap:6px}.app[data-phase=think] .progress{display:none}
.timer b{font-family:var(--poster);font-weight:400;font-size:40px;line-height:1}
.bar{display:block;height:5px;border-radius:3px;background:#ffffff40;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--yellow)}
.timer.over b{color:var(--yellow);animation:pulse .8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.entry small.sub{text-transform:none;letter-spacing:0;color:var(--gray);font-weight:400;font-size:13px;margin:2px 0 0}
#end{display:none}.app.ended #game{display:none!important}.app.ended #end{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;width:100%;max-width:340px;align-self:center}
.endtitle{font-family:var(--poster);font-weight:400;font-size:62px;line-height:1;margin:0}#end p{margin:0;color:var(--yellow);font-size:15px}#end .winner{font-size:17px;font-weight:700;color:#fff}#end .cta{width:100%}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin:6px 0}.score{background:var(--paper);color:var(--red-dark);border-radius:18px;padding:16px 8px}
.score em{display:block;font-style:normal;font-weight:700;color:var(--ink);margin-bottom:6px;overflow-wrap:anywhere}.score b{display:block;font-family:var(--poster);font-weight:400;font-size:56px;line-height:1}.score span{font-size:12px;color:var(--gray)}
.alertwrap{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:28px;background:#0009;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}.alertwrap.show{opacity:1;visibility:visible;transition-delay:0s}
.alertbox{width:100%;max-width:300px;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;text-align:center;transform:scale(.94);transition:transform .22s cubic-bezier(.2,.9,.3,1)}.alertwrap.show .alertbox{transform:none}
.alertbox h3{margin:0;padding:20px 18px 6px;font-size:17px}.alertbox p{margin:0;padding:0 18px 18px;font-size:14px;line-height:1.35;color:#6b5a56}
.alertbtns button{display:block;width:100%;border:0;border-top:1px solid #e1d8bd;background:transparent;padding:15px 8px;font-size:17px;font-weight:700;color:var(--red-dark)}.alertbtns .danger{font-weight:500;color:#d11a2a}.alertbtns button:active{background:#0000000d}
#ctlRate .cta{font-size:16px;line-height:1.15;padding:14px 10px}
.ver{margin:0;font-size:11px;letter-spacing:.06em;color:#efe4b080;text-align:center}
#ctlWild{display:none}.app[data-card=wild][data-phase=answer] #ctlRate{display:none}.app[data-card=wild][data-phase=answer] #ctlWild{display:flex}
.linkbtn{background:none;border:0;color:var(--cream);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}
.navright{display:flex;gap:8px}#howBtn2{width:34px;padding:7px 0;text-align:center}
.sheet.tall{max-height:88%}.sheetfoot{display:none;padding:8px 16px calc(env(safe-area-inset-bottom) + 14px)}.sheet.cta-on .sheetfoot{display:block}.sheetfoot .cta{width:100%;background:var(--red);color:var(--cream)}
.howintro{margin:0 4px 12px;font-size:15px;line-height:1.4;color:#6b5a56}.step{padding:13px 16px;background:var(--paper)}.step+.step{border-top:1px solid #e1d8bd}.step b{display:block;font-size:16px;margin-bottom:3px;color:var(--ink)}.step span{font-size:14px;line-height:1.4;color:#6b5a56}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#modeBody,#namesBody,#setupBody{display:none}.app[data-screen=mode] #modeBody,.app[data-screen=names] #namesBody,.app[data-screen=setup] #setupBody{display:flex}
.back{align-self:flex-start;padding:0}.optblock{width:100%;display:grid;gap:9px}
.optlabel{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--cream)}.opthint{margin:0;font-size:13px;line-height:1.35;color:#ffe4e5;text-align:center}
.tsw{--p:0;position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;padding:5px;border-radius:24px;background:#ffffff26;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tsw .thumb{z-index:2;pointer-events:none;overflow:hidden;position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:19px;background:var(--cream);box-shadow:0 3px 10px #0004;transform:translateX(calc(var(--p) * 100%));transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.tsw.drag .thumb,.tsw.drag .tcopy{transition:none}
.tcopy{position:absolute;left:0;top:0;bottom:0;width:200%;display:grid;grid-template-columns:1fr 1fr;transform:translateX(calc(var(--p) * -50%));transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.tcopy .co{display:grid;justify-items:center;align-content:center;gap:3px;padding:10px 6px 11px;color:var(--red-dark);font-size:13px;font-weight:700}.tcopy svg{width:40px;height:40px}
.tsw .opt{position:relative;z-index:1;align-content:center;display:grid;justify-items:center;gap:3px;padding:10px 6px 11px;background:none;border:0;color:var(--cream);font-size:13px;font-weight:700;transition:color .25s}
.tsw .opt svg{width:40px;height:40px}
.tpanel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.3,1,.4,1),opacity .3s}.tpanel.open{grid-template-rows:1fr;opacity:1}.tinner{overflow:hidden;min-height:0}
.clockrow{display:flex;align-items:center;gap:14px;padding-top:8px}#clock{width:96px;height:96px;flex:none;color:var(--cream)}#clock.tick{animation:tick .35s}@keyframes tick{40%{transform:scale(1.09) rotate(-4deg)}}
#pie{transition:stroke-dasharray .45s cubic-bezier(.3,1.2,.5,1)}#hand{transform-origin:50px 56px;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.tctl{flex:1;min-width:0}.tval{font-family:var(--poster);font-size:36px;line-height:1;color:var(--cream)}.tends{display:flex;justify-content:space-between;font-size:11px;color:#ffe4e5aa}
#tsl{width:100%;margin:12px 0 6px;-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;outline:none;background:linear-gradient(to right,var(--cream) var(--v,27%),#ffffff33 var(--v,27%))}
#tsl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--cream);border:0;box-shadow:0 2px 8px #0006}#tsl::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--cream);border:0}
#levels button{pointer-events:none;font-size:11px;letter-spacing:.02em;padding:9px 2px;white-space:nowrap}#levels .done{opacity:.6}#levels .done::before{content:'✓ '}
.center{text-align:center;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.tile{position:relative;display:grid;justify-items:center;align-content:start;gap:6px;padding:18px 10px 16px;background:#ffffff26;border:0;border-radius:24px;color:var(--cream);text-align:center;transition:transform .2s,background .3s,color .3s}
.tile svg{width:78px;height:78px;margin-bottom:2px}.tile b{font-family:var(--poster);font-weight:400;font-size:32px;line-height:1}.tile span{font-size:12px;line-height:1.3;color:#ffe4e5}
.tile:active{transform:scale(.95)}.tile.picked{background:var(--cream);color:var(--red-dark);transform:scale(1.03)}.tile.picked span{color:#6b5a56}
.tile:nth-child(1) svg{animation:bob 3.4s ease-in-out infinite}.tile:nth-child(2) svg{animation:bob 3.4s ease-in-out -1.7s infinite}
.modechip{display:flex;align-items:center;gap:8px;align-self:center;background:#ffffff26;border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-size:14px}.modechip svg{width:26px;height:26px}
.tsw.compact .opt,.tsw.compact .tcopy .co{padding:13px 6px;font-size:14px}
.wtitle{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:12px;color:#9b5a58}.cardbottom span{white-space:nowrap}
@media(max-height:700px){.mark{width:210px}.turn b{font-size:34px}.question{font-size:22px}}
@media(prefers-reduced-motion:reduce){.tsw .thumb,.tcopy,.tpanel,#pie,#hand{transition:none}#clock.tick{animation:none}.tile svg{animation:none}.app,.sheet,.scrim,.alertwrap,.alertbox{transition:none}.timer.over b{animation:none}.cupidwrap{animation:none}}

function shoot(ref,dir,scale,dur,vert){
if(!ref||!ref.offsetParent||!document.body.animate)return;
const W=app.clientWidth,H=app.clientHeight,w=156*scale,h=36*scale,el=document.createElement('div');
el.className='arrow';el.innerHTML=ARROW;el.firstChild.style.cssText=`width:${w}px;height:${h}px`;
let yy=0,eo=ref;while(eo&&eo!==app){yy+=eo.offsetTop;eo=eo.offsetParent}const cy=yy+ref.offsetHeight/2;
if(vert){
/* olho no olho: a flecha sobe (dir<0) ou desce (dir>0) no eixo da tela, que gira junto a cada vez */
const rt=dir<0?'rotate(-90deg)':'rotate(90deg)',a=dir<0?H-cy+w:-cy-w,b=dir<0?-cy-w:H-cy+w;
el.style.left=(W/2-w/2)+'px';el.style.top=(cy-h/2)+'px';app.append(el);
el.animate([{transform:`translateY(${a}px) ${rt}`},{transform:`translateY(${b}px) ${rt}`}],{duration:dur,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'}).onfinish=()=>el.remove();
return}
el.style.top=cy+'px';app.append(el);
const a=dir<0?W+20:-w-20,b=dir<0?-w-20:W+20,f=dir<0?' scaleX(-1)':'';
el.animate([{transform:`translate(${a}px,-50%)${f} rotate(-3deg)`},{transform:`translate(${b}px,-50%)${f} rotate(-3deg)`}],{duration:dur,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'}).onfinish=()=>el.remove();
}

function makeSwitch(el,onChange){

el.addEventListener('pointerdown',e=>{drag={x0:e.clientX,p0:parseFloat(el.style.getPropertyValue('--p'))||0,w:el.getBoundingClientRect().width/2,moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}});
el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0;if(!drag.moved&&Math.abs(dx)<5)return;drag.moved=true;el.classList.add('drag');const q=Math.min(1,Math.max(0,drag.p0+dx/drag.w));el.style.setProperty('--p',q);el.dataset.v=q>.5?1:0});
const end=e=>{if(!drag)return;let q;if(drag.moved)q=parseFloat(el.style.getPropertyValue('--p'))>.5?1:0;else{const r=el.getBoundingClientRect();q=(e.clientX-r.left)>r.width/2?1:0}
drag=null;el.classList.remove('drag');requestAnimationFrame(()=>{setSw(el,q);if(q!==v){v=q;onChange(q)}})};
el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
el.querySelectorAll('.opt').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const q=+b.dataset.i;setSw(el,q);if(q!==v){v=q;onChange(q)}}}));
}

const LEVELS=['LEVEL ONE','LEVEL TWO','LEVEL THREE'];let stage=0;
/* indicador dos 3 níveis (só mostra onde vocês estão; o jogo avança sozinho a cada 5 cartas) */
function buildStages(){const nav=$('levels');nav.innerHTML='';t().stages.forEach((nm,i)=>{const b=document.createElement('button');b.tabIndex=-1;b.dataset.s=i;b.textContent=(i+1)+' · '+nm;nav.append(b)});markStages()}
function markStages(){document.querySelectorAll('#levels button').forEach(b=>{const i=+b.dataset.s;b.classList.toggle('active',i===stage);b.classList.toggle('done',i<stage);b.setAttribute('aria-current',i===stage?'step':'false')})}

/* começa um nível: baralho só desse nível, primeira carta sorteada */
function setStage(n){
stage=n;level=LEVELS[n];deck=all.filter(c=>c.level===level||c.level==='ANY');markStages();closeSheet();stopTimer();phase='read';used=new Set();if(!deck.length)return;
const ok=deck.map((_,i)=>i).filter(i=>!excluded.has(deck[i].id));index=ok.length?ok[Math.floor(Math.random()*ok.length)]:0;render();
}

/* próxima carta aleatória: sem repetir e sem as descartadas nesta partida */
function pickRandom(){
const idx=deck.map((_,i)=>i).filter(i=>i!==index&&!excluded.has(deck[i].id));
let pool=idx.filter(i=>!used.has(i));
if(!pool.length){used=new Set([index]);pool=idx}
return pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
}

function render(){
if(!deck.length)return;const c=deck[index],w=t(),n=String(all.findIndex(x=>x.id===c.id)+1).padStart(3,'0'),fav=favorites.includes(c.id);
used.add(index);if(c.level==='ANY')excluded.add(c.id);app.dataset.phase=phase;app.dataset.card=c.wildcard?'wild':'q';
$('answerStart').textContent=c.wildcard?w.wildStart:w.answerStart;$('readDone').textContent=c.wildcard?w.wildGo:w.readDone;const cs=c.wildcard?cardSeconds(c):null;
const qEl=$('question');qEl.textContent='';const wt=c.title_en?(lang==='pt'?c.title_pt:c.title_en):'';if(wt){const sp=document.createElement('span');sp.className='wtitle';sp.textContent=wt;qEl.append(sp)}qEl.append(document.createTextNode(textOf(c)));$('question').classList.toggle('wild',!!c.wildcard);
$('cardLevel').textContent=levelName(c.level==='ANY'?level:c.level);$('cardType').textContent=c.wildcard?w.wild:w.talk;$('cardNum').textContent=w.cardWord+n;
$('heart').classList.toggle('on',fav);$('heart').setAttribute('aria-label',fav?'Remover das favoritas':'Favoritar');

/* passa para outra carta. flipTurn=true: troca de jogador (e a tela vira no modo olho no olho). false: só troca a carta */
function advance(flipTurn){
if(busy||!deck.length)return;
const ns=Math.min(2,Math.floor(done/PER));let nd=deck,target;
if(ns!==stage){nd=all.filter(c=>c.level===LEVELS[ns]||c.level==='ANY');const ok=nd.map((_,i)=>i).filter(i=>!excluded.has(nd[i].id));target=ok.length?ok[Math.floor(Math.random()*ok.length)]:null}
else target=pickRandom();
if(target===null){endMatch();return}
busy=true;stopTimer();
const face=flipTurn&&mode==='face',reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* lado a lado: a flecha vai para o lado de quem joga agora (jogador 1 à esquerda, 2 à direita); olho no olho: sobe/desce com a virada da tela */

};

}

/* timer de 1 minuto, ativado por quem leu a pergunta */
let timerLimit=LIMIT;
function cardSeconds(c){const m=(lang==='pt'?c.text_pt:c.text_en).match(/(\d+)\s*(sec|seg|min)/i);return m?(/min/i.test(m[2])?m[1]*60:+m[1]):null}
function startTimer(sec){stopTimer();timerLimit=sec||tsec;timerEnd=Date.now()+timerLimit*1000;$('timer').classList.remove('over');tick();timerId=setInterval(tick,200)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function tick(){
const left=Math.max(0,timerEnd-Date.now()),s=Math.ceil(left/1000);
$('timeText').textContent=left===0?t().timeUp:Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
$('timeBar').style.width=(left/(timerLimit*1000)*100)+'%';
if(left===0){$('timer').classList.add('over');stopTimer()}
}

/* fluxo de cada turno: ler → (timer) → responder → avaliar */
$('readDone').onclick=()=>{if(busy)return;const c=deck[index],sec=c.wildcard?cardSeconds(c):null;if(sec||timerOn){phase='think';startTimer(sec)}else phase='answer';render()};
$('answerStart').onclick=()=>{if(busy)return;stopTimer();if(deck[index].wildcard){finishWild();return}phase='answer';render()};
$('wildDone').onclick=finishWild;
/* desafio (coringa): conta como carta jogada, mas não entra no placar */
function finishWild(){if(busy)return;done++;if(done>=TOTAL)endMatch();else advance(true)}
$('rateYes').onclick=()=>rate(true);$('rateNo').onclick=()=>rate(false);
function rate(honest){
if(busy||phase!=='answer')return;
const a=1-turn;score[a][1]++;if(honest)score[a][0]++;done++;
if(done>=TOTAL)endMatch();else advance(true);
}

/* fim da partida: placar de sinceridade */
function endMatch(){
stopTimer();busy=true;const w=t();
$('endTitle').textContent=w.endTitle;$('endSub').textContent=w.endSub(TOTAL);
const box=$('scores');box.innerHTML='';
score.forEach((s,i)=>{const d=document.createElement('div');d.className='score';const e=document.createElement('em'),b=document.createElement('b'),sp=document.createElement('span');e.textContent=names[i];b.textContent=s[0]+'/'+s[1];sp.textContent=w.honestCount;d.append(e,b,sp);box.append(d)});
const [s0,s1]=score,r0=s0[1]?s0[0]/s0[1]:0,r1=s1[1]?s1[0]/s1[1]:0;$('winner').textContent=Math.abs(r0-r1)<1e-9?w.tie:w.best+' '+names[r0>r1?0:1];
$('againBtn').textContent=w.again;$('endHome').textContent=w.home;
const spin=turn===1&&mode==='face';
if(spin){rot+=180;app.style.transform=`rotate(${rot}deg)`}
setTimeout(()=>{resetRotation();app.classList.add('ended');busy=false},spin?650:0);
}

$('heart').onclick=()=>{const id=deck[index].id;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];store.set('nm-favorites',JSON.stringify(favorites));render()};
$('more').onclick=()=>{if(busy||phase==='answer')return;openSheet('actions')};

/* descartar: a carta sai do baralho até o fim desta partida e não conta nas 20 */
function discard(){if(busy)return;excluded.add(deck[index].id);closeSheet();advance(false)}

function openSheet(type){
const w=t(),list=$('sheetList');list.innerHTML='';const g=document.createElement('div');g.className='group';
if(type==='actions'){
$('sheetTitle').textContent=w.cardActions;
[w.answered,w.skip].forEach(label=>{const b=document.createElement('button');b.className='entry';b.append(document.createTextNode(label));const s=document.createElement('small');s.className='sub';s.textContent=w.actionNote;b.append(s);b.onclick=discard;g.append(b)});
list.append(g);
}else{
const ids=type==='favorites'?[...favorites].reverse():history,items=ids.map(findCard).filter(Boolean);
$('sheetTitle').textContent=type==='favorites'?w.favorites:w.recent;
if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent=type==='favorites'?w.emptyFav:w.emptyHist;list.append(e)}
else{items.forEach(c=>{const b=document.createElement('div');b.className='entry';const s=document.createElement('small');s.textContent=[levelName(c.level),c.wildcard?w.wild:''].filter(Boolean).join(' · ');b.append(s,document.createTextNode(textOf(c)));g.append(b)});list.append(g)}
}
list.scrollTop=0;$('sheet').classList.add('show');$('scrim').classList.add('show');
}
function closeSheet(){$('sheet').classList.remove('show','tall','cta-on');$('scrim').classList.remove('show')}
function openHowTo(first){
const w=t(),list=$('sheetList');list.innerHTML='';$('sheetTitle').textContent=w.howTitle;
const intro=document.createElement('p');intro.className='howintro';intro.textContent=w.howIntro;list.append(intro);
const g=document.createElement('div');g.className='group';
w.howSteps.forEach(([h,x],i)=>{const d=document.createElement('div'),b=document.createElement('b'),sp=document.createElement('span');d.className='step';b.textContent=(i+1)+'. '+h;sp.textContent=x;d.append(b,sp);g.append(d)});
list.append(g);list.scrollTop=0;$('howtoGo').textContent=w.howGo;
$('sheet').classList.toggle('cta-on',!!first);$('sheet').classList.add('tall','show');$('scrim').classList.add('show');
}
$('favoritesBtn').onclick=()=>{shoot($('tabbar'),-1,.5,340);openSheet('favorites')};$('historyBtn').onclick=()=>{shoot($('tabbar'),1,.5,340);openSheet('history')};$('sheetClose').onclick=closeSheet;$('scrim').onclick=closeSheet;

if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;let reloaded=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}))}
init();
</script></body></html>
